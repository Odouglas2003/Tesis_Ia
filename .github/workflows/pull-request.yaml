name: Pull Request Workflow
on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  pr-validation:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

