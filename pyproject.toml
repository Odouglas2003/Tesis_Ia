# pyproject.toml

[tool.black]
line-length = 88
target-version = ['py310'] # La versión de Python que usas

[tool.isort]
profile = "black" # Para que sea 100% compatible con Black
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = [
  "E203", # Espacio antes de ':' (incompatible con Black)
  "W503", # Salto de línea antes de operador binario (incompatible con Black)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true