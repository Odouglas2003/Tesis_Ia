# tox.ini

[tox]
env_list = lint, format, typecheck, test, build  

[testenv]
# Configuración base para todos los entornos
package = skip
set_env = 
    PYTHONPATH = {toxinidir}
deps = 
    -r requirements.txt
    -r requirements-dev.txt 

[testenv:lint]
description = "Ejecuta los linters (Flake8)"
commands =
    flake8 .

[testenv:format]
description = "Verifica el formato del código con Black y isort"
commands =
    black --check .
    isort --check-only .

[testenv:typecheck]
description = "Verifica los tipos estáticos con Mypy"
commands =
    mypy .

[testenv:test]
description = "Ejecuta las pruebas unitarias con pytest"
deps =
    pytest
commands =
    pytest

[testenv:build]
description = "Ejecuta todas las verificaciones de calidad (lint, format, test) - mypy DESACTIVADO"
commands =
    {[testenv:lint]commands}
    {[testenv:format]commands}
    # {[testenv:typecheck]commands}
    #{[testenv:test]commands}

[flake8]
# ... (tu configuración de flake8 está perfecta)
exclude =
    .tox,
    .git,
    __pycache__,
    venv,
    build,
    dist,
    *.egg-info
max-line-length = 88
extend-ignore =
    E203,
    W503,
    E501

[testenv:apply-format]
description = "APLICA el formato del código con Black y isort"
commands =
    black .
    isort .

[mypy]
# Ignorar los módulos de terceros que no tienen información de tipos
ignore_missing_imports = True