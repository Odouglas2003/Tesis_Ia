services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - rubik-net

  rubik-ai-engine:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: rubik-ai-engine
    restart: always
    env_file:
      - .env
    depends_on:
      - mongodb
    ports:
      - "8000:8000"
    
    volumes:
      - ./app:/app/app 
      
    networks:
      - rubik-net
volumes:
  mongo_data:

networks:
  rubik-net:
    driver: bridge
