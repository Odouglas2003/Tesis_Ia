services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    profiles:
      - local-db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - rubik-net

  rubik-ai-engine:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: rubik-ai-engine
    restart: always
    env_file:
      - .env
    environment:
      MONGO_DB_CONNECTION_STRING: ${MONGO_DB_CONNECTION_STRING}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-tesis}
    ports:
      - "8000:8000"
    
    volumes:
      - ./app:/app/app 
      
    networks:
      - rubik-net
volumes:
  mongo_data:

networks:
  rubik-net:
    driver: bridge
